<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 290px; margin: 12px; color: #111; }
  button { width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 6px; cursor: pointer; color: #fff; }
  #toggle.on { background: #16a34a; } #toggle.off { background: #6b7280; }
  #status { margin: 8px 0; color: #555; }
  #tabs { margin: 0 0 10px; padding-left: 16px; color: #333; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 4px; margin-top: 2px; }
  .row { display: flex; gap: 6px; margin-top: 12px; }
  .row button { background: #e5e7eb; color: #111; font-size: 13px; padding: 6px; }
</style>
</head>
<body>
  <button id="toggle" class="on">Watching</button>
  <div id="status"></div>
  <ul id="tabs"></ul>
  <label>ntfy topic (phone push, blank = off)</label>
  <input id="ntfyTopic" type="text">
  <label><input id="sound" type="checkbox"> Alarm sound</label>
  <div class="row"><button id="test">Test alert</button></div>
  <script src="popup.js"></script>
</body>
</html>
